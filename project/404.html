<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 - Lost in Noise | John Doe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">:root {
    --bg-deep: #0D0D0D;
    --charcoal: #1A1A1A;
    --accent: #E6FB04;
    --text-main: #FFF;
    --text-muted: #A0A0A0
    }
body {
    font-family: "Inter", sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden
    }
.serif-display {
    font-family: "Playfair Display", serif
    }
.noise-texture {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAAcb5WkShg6uLYg7AKy81y1VXz7D6DKysKCYNQinKQRejTvQELudcUrXVGG8Jt90C4nFa9byZXJkFV-ZSS8kekSKu5OFDjsiruUXlNrF4XhLPJouv2yTNYedffOOYvo5ss_4hsaKoDWe10PGmC5NPgox7o6wknnKflJbVOpsWRXWndeYtAyv2_cbuTy_5QrIxu35Nva-H8nrt3Iib4iImVgYc-82sxTos4tNF5lVZAhbNYYVwLutQDSIbFJfbptOFTuE1g6wDoRGQ);
    opacity: 0.05;
    pointer-events: none
    }
.floating-shape {
    position: absolute;
    width: 400px;
    height: 400px;
    border: 1px solid rgba(230, 251, 4, 0.2);
    border-radius: 40% 60% 70% 30%/40% 50% 60% 50%;
    z-index: -1;
    filter: blur(40px)
    }
.glitch-text {
    position: relative;
    display: inline-block
    }
.glitch-text::before, .glitch-text::after {
    content: "404";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8
    }
.glitch-text::before {
    color: #ff00c1;
    z-index: -1;
    transform: translate(-4px, 2px);
    filter: blur(1px)
    }
.glitch-text::after {
    color: #00fff9;
    z-index: -2;
    transform: translate(4px, -2px);
    filter: blur(1px)
    }</style>
</head>
<body class="selection:bg-[var(--accent)] selection:text-black min-h-screen flex flex-col">
<div class="fixed inset-0 noise-texture z-0"></div>
<div class="relative z-10 flex flex-col min-h-screen max-w-[1440px] mx-auto px-6 md:px-12 lg:px-20 w-full">
<header class="py-10 flex justify-between items-center">
<div class="group cursor-pointer">
<div class="border-2 border-[var(--text-main)] w-10 h-10 flex items-center justify-center transition-all duration-300 group-hover:border-[var(--accent)] group-hover:bg-[var(--accent)]">
<span class="text-xl font-bold transition-colors group-hover:text-black">K</span>
</div>
</div>
<nav class="flex items-center space-x-8 text-sm uppercase tracking-widest font-medium">
<a class="hover:text-[var(--accent)] transition-colors" href="#">Work</a>
<a class="hover:text-[var(--accent)] transition-colors" href="#">About</a>
<button class="material-symbols-outlined text-3xl">menu</button>
</nav>
</header>
<main class="flex-grow flex flex-col items-center justify-center relative py-20 text-center">
<div class="floating-shape -top-20 -left-20 animate-[spin_20s_linear_infinite]"></div>
<div class="relative">
<h1 class="serif-display text-[12rem] md:text-[20rem] lg:text-[24rem] leading-none tracking-tighter opacity-10 select-none glitch-text">
                    404
                </h1>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<p class="serif-display text-4xl md:text-6xl mb-6 italic tracking-tight">Lost in the noise.</p>
<p class="text-[var(--text-muted)] text-lg md:text-xl font-light max-w-lg mx-auto leading-relaxed px-4">
                        The page you are looking for has drifted into the void, or perhaps it never truly existed in this reality.
                    </p>
<div class="mt-12">
<a class="inline-flex items-center gap-4 bg-[var(--accent)] text-black px-10 py-5 text-sm uppercase tracking-[0.2em] font-bold transition-all duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(230,251,4,0.3)]" href="#">
                            Back to Safety
                            <span class="material-symbols-outlined text-xl">arrow_right_alt</span>
</a>
</div>
</div>
</div>
</main>
<footer class="py-16 border-t border-white/10">
<div class="flex flex-col md:flex-row justify-between items-center gap-12">
<div class="text-center md:text-left">
<h2 class="serif-display text-2xl">Visual storyteller.</h2>
</div>
<div class="flex flex-col items-center md:items-end gap-6">
<div class="flex space-x-8">
<a class="text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors uppercase text-[10px] tracking-[0.3em]" href="#">Instagram</a>
<a class="text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors uppercase text-[10px] tracking-[0.3em]" href="#">LinkedIn</a>
<a class="text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors uppercase text-[10px] tracking-[0.3em]" href="#">Dribbble</a>
</div>
<p class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] opacity-50">© 2024 John Doe. Lost but not forgotten.</p>
</div>
</div>
</footer>
</div>

</body></html>
