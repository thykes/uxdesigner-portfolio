<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact the Designer - Modern Portfolio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --bg-deep: #0D0D0D;
            --charcoal: #1A1A1A;
            --accent: #E6FB04;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        .serif-display {
            font-family: 'Playfair Display', serif;
        }
        input, textarea, select {
            background: transparent !important;
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            border-radius: 0 !important;
            transition: border-color 0.3s ease;
        }
        input:focus, textarea:focus, select:focus {
            outline: none !important;
            border-bottom-color: var(--accent) !important;
            box-shadow: none !important;
        }
        .contact-link-hover {
            position: relative;
            display: inline-block;
        }
        .contact-link-hover::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
        .contact-link-hover:hover::after {
            width: 100%;
        }
    </style>
<style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
    </style>
</head>

<div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-20 w-full">
<header class="py-10 flex justify-between items-center">
<div class="group cursor-pointer">
<div class="border-2 border-[var(--text-main)] w-10 h-10 flex items-center justify-center transition-all duration-300 group-hover:border-[var(--accent)] group-hover:bg-[var(--accent)]">
<span class="text-xl font-bold transition-colors group-hover:text-black">K</span>
</div>
</div>
<nav class="flex items-center space-x-8 text-sm uppercase tracking-widest font-medium">
<a class="hover:text-[var(--accent)] transition-colors" href="#">Work</a>
<a class="hover:text-[var(--accent)] transition-colors" href="#">About</a>
<button class="material-symbols-outlined text-3xl">menu</button>
</nav>
</header>

                    </h1>

<div>

</div>
</div>
</div>
</div>
<div class="lg:col-span-6 lg:pl-12">
<form class="space-y-12">
<div class="grid grid-cols-1 md:grid-cols-2 gap-12">
<div class="group">
<label class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] block mb-2">Name</label>
<input class="w-full text-lg font-light text-white placeholder:text-white/20" placeholder="Johnathan Doe" type="text"/>
</div>
<div class="group">
<label class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] block mb-2">Email Address</label>
<input class="w-full text-lg font-light text-white placeholder:text-white/20" placeholder="john@example.com" type="email"/>
</div>
</div>
<div class="group">
<label class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] block mb-2">Project Type</label>
<select class="w-full text-lg font-light text-white appearance-none cursor-pointer">
<option class="bg-[var(--bg-deep)]">Brand Identity</option>
<option class="bg-[var(--bg-deep)]">Product Photography</option>
<option class="bg-[var(--bg-deep)]">Digital Design</option>
<option class="bg-[var(--bg-deep)]">Art Direction</option>
</select>
</div>
<div class="group">
<label class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] block mb-2">Message</label>
<textarea class="w-full text-lg font-light text-white placeholder:text-white/20 resize-none" placeholder="Tell me about your vision..." rows="4"></textarea>
</div>
<div class="pt-6">
<button class="w-full md:w-auto px-16 py-5 bg-[var(--accent)] text-black text-sm uppercase tracking-[0.2em] font-bold hover:bg-white transition-all duration-500" type="submit">
                                Send Message
                            </button>
</div>
</form>
</div>
</div>
</main>
<footer class="py-12 border-t border-white/10 mt-20">
<div class="flex flex-col md:flex-row justify-between items-center gap-8">
<div class="flex space-x-8 text-[10px] uppercase tracking-widest text-[var(--text-muted)]">
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-white transition-colors" href="#">Terms of Service</a>
</div>
<p class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] opacity-50">
                    © 2024 John Doe. Portfolio Edition.
                </p>
</div>
</footer>
</div>
