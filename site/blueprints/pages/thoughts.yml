title: Thoughts
options:
  delete: false
  status: true

columns:
  - width: 2/3
    sections:
      drafts:
        type: pages
        headline: Drafts
        template: article
        status: draft
        layout: cards
        image: false
        info: "{{ page.autopublish.isNotEmpty ? '⏰ ' ~ page.autopublish.toDate('d.m.Y @ H:i') : 'Draft' }}"
        sortBy: date desc

      published:
        type: pages
        headline: Published
        template: article
        status: listed
        layout: cards
        image: false
        info: "{{ page.date.toDate('d.m.Y') }}"
        sortable: true

  - width: 1/3
    sections:
      content:
        type: fields
        fields:
          intro:
            label: Page Intro
            type: textarea
            size: small
