title: Thoughts
options:
  delete: false
  status: true

columns:
  - width: 2/3
    sections:
      drafts:
        type: pages
        headline: Drafts
        template: article
        status: draft
        layout: cards
        image:
          query: page.cover.toFile
          cover: true
        sortBy: date desc

      scheduled:
        type: pages
        headline: Scheduled
        template: article
        status: unlisted
        layout: cards
        image:
          query: page.cover.toFile
          cover: true
        info: "{{ page.date.toDate('d.m.Y') }}"
        sortable: true

      published:
        type: pages
        headline: Published
        template: article
        status: listed
        layout: cards
        image:
          query: page.cover.toFile
          cover: true
        info: "{{ page.date.toDate('d.m.Y') }}"
        sortable: true

  - width: 1/3
    sections:
      content:
        type: fields
        fields:
          intro:
            label: Page Intro
            type: textarea
            size: small
