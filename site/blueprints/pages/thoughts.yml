title: Thoughts
options:
  delete: false
  status: true

columns:
  - width: 2/3
    sections:
      drafts:
        type: pages
        headline: Drafts
        template: article
        status: draft
        layout: cards
        image:
          query: page.cover.toFile
          cover: true
        sortBy: date desc

      articles:
        type: pages
        headline: Articles (Published & Scheduled)
        template: article
        layout: cards
        image:
          query: page.cover.toFile
          cover: true
        info: "{{ page.date.toDate('d.m.Y') }} {{ page.date.toDate > date.toDate ? '(FUTURE)' : '' }}"
        status: listed
        sortable: true

  - width: 1/3
    sections:
      content:
        type: fields
        fields:
          intro:
            label: Page Intro
            type: textarea
            size: small
