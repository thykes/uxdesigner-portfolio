title: About Page
options:
  delete: false
  status: false
  url: false

tabs:
  content:
    label: Content
    columns:
      - width: 2/3
        sections:
          bio_section:
            type: fields
            fields:
              # Header Section
              role_title:
                label: Role Label (Top)
                type: text
                default: "UX Designer & Strategist"
                width: 1/2
              header_title:
                label: Header Title
                type: text
                default: "Crafting the <span class='italic'>unseen</span> details of digital life."
              intro:
                label: Main Bio (Top Paragraph)
                type: textarea
                size: large
              detailed_bio:
                label: Detailed Bio (Bottom Paragraph)
                type: textarea
                size: large

              # Capabilities Section
              capabilities_headline:
                label: Capabilities Headline
                type: text
                default: Capabilities
              capabilities_intro:
                label: Capabilities Intro
                type: textarea
              capabilities:
                label: Capabilities List
                type: structure
                fields:
                  title:
                    type: text
                    width: 1/2
                  description:
                    type: textarea
                    size: small

              # Experience Section
              experience_headline:
                label: Experience Headline
                type: text
                default: Experience
              experience:
                label: Experience List
                type: structure
                fields:
                  role:
                    type: text
                    width: 1/2
                  company:
                    type: text
                    width: 1/2
                  timeline:
                    type: text
                    width: 1/2

      - width: 1/3
        sections:
          meta_section:
            type: fields
            fields:
              cover:
                type: files
                label: Portrait Image
                max: 1
              location:
                label: Location Text
                type: text
                default: Based in New York City
              email:
                label: Contact Email
                type: email

  seo: seo/page
