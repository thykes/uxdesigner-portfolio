title: About Page
options:
  delete: false
  status: false
  url: false

tabs:
  content:
    label: Content
    columns:
      - width: 2/3
        sections:
          bio_section:
            type: fields
            fields:
              # Header Section
              role_title:
                label: Role Label (Top)
                type: text
                default: "UX Designer & Strategist"
                width: 1/2
              header_title:
                label: Header Title
                type: text
                default: "Crafting the <span class='italic'>unseen</span> details of digital life."
              intro:
                label: Main Bio (Top Paragraph)
                type: textarea
                size: large
              detailed_bio:
                label: Detailed Bio (Bottom Paragraph)
                type: textarea
                size: large

              # Capabilities Section
              capabilities_headline:
                label: Capabilities Headline
                type: text
                default: Capabilities
              capabilities_intro:
                label: Capabilities Intro
                type: textarea
              capabilities:
                label: Capabilities List
                type: structure
                fields:
                  title:
                    type: text
                    width: 1/2
                  description:
                    type: textarea
                    size: small

              # Experience Section
              experience_headline:
                label: Experience Headline
                type: text
                default: Experience
              experience:
                label: Experience List
                type: structure
                fields:
                  role:
                    type: text
                    width: 1/2
                  company:
                    type: text
                    width: 1/2
                  timeline:
                    type: text
                    width: 1/2

      - width: 1/3
        sections:
          meta_section:
            type: fields
            fields:
              cover:
                type: files
                label: Portrait Image
                max: 1
              location:
                label: Location Text
                type: text
                default: Based in New York City
              email:
                label: Contact Email
                type: email

  schema:
    label: Google Person Schema
    icon: account
    columns:
      - width: 1/2
        fields:
          schema_name:
            label: Full Name
            type: text
            help: "Your official name for Google."
          schema_image:
            label: Profile Photo
            type: files
            multiple: false
            help: "The official headshot for Google knowledge panel."
          schema_alternate_name:
            label: Alternate Name / Nickname
            type: text
          schema_job_title:
            label: Job Title
            type: text
          schema_works_for_name:
            label: Current Company Name
            type: text
          schema_works_for_url:
            label: Current Company URL
            type: url
          schema_alumni_name:
            label: Alumni University Name
            type: text
          schema_alumni_url:
            label: Alumni University URL
            type: url

      - width: 1/2
        fields:
          schema_birth_date:
            label: Birth Date
            type: date
            display: DD-MM-YYYY
          schema_birth_place:
            label: Birth Place (City, Country)
            type: text
          schema_knows_about:
            label: Knows About (Skills/Topics)
            type: tags
            help: "Key topics you are an expert in (e.g. UX Design, AI)."
          schema_award:
            label: Awards
            type: tags
            help: "List your awards here."
          schema_same_as:
            label: Social Profiles (SameAs)
            type: structure
            fields:
              url:
                label: Profile URL
                type: url
                placeholder: https://linkedin.com/in/...
