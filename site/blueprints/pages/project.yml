title: Project Case Study
options:
  delete: true
  status: true

tabs:
  content:
    label: Case Study Content
    columns:
      - width: 2/3
        fields:
          subtitle:
            type: text
            label: Subtitle (Top Label)
            width: 1/2
          hero_title:
            label: Custom Hero Title (Overrides Default)
            type: textarea
            size: small
            help: "Use this for special formatting like (br:) or (accent: text)"
          role:
            type: text
            width: 1/2
          timeline:
            type: text
            width: 1/2
          intro:
            label: Project Intro
            type: textarea
            buttons: false
            size: small

          text:
            label: Main Content Blocks
            type: blocks
            fieldsets:
              - heading
              - text
              - list
              - image
              - before-after
              - video
              - quote
              - code
              - gallery
              - scroll-gallery
              - stats-grid

      - width: 1/3
        fields:
          cover:
            type: files
            label: Hero Background Image
            max: 1

  seo: seo/page
