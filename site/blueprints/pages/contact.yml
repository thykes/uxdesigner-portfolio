title: Contact Page
options:
  delete: false
  status: true
  url: true

tabs:
  content:
    label: Content
    columns:
      - width: 2/3
        fields:
          headline:
            label: Main Headline
            type: textarea
            buttons: false
            size: small
          direct_contact_title:
            label: Direct Contact Title
            type: text
            default: Direct Contact
            width: 1/2
          email:
            label: Email Address
            type: email
            default: hello@johndoe.design
            width: 1/2
          social_title:
            label: Social Channels Title
            type: text
            default: Social Channels
            width: 1/2

      - width: 1/3
        sections:
          meta:
            type: fields
            fields:
              form_settings:
                label: Form Settings
                type: headline
              success_message:
                label: Success Message
                type: textarea
                default: Your message has been sent, thank you. We will get back to you soon!
                buttons: false

  seo: seo/page
