title: Home Page
options:
  delete: false
  status: false
  url: false

tabs:
  content:
    label: Content
    columns:
      - width: 2/3
        fields:
          headline:
            label: Hero Headline
            type: writer
            nodes: false
            marks:
              - italic
          intro:
            label: Hero Intro Text
            type: writer
            marks:
              - bold
              - italic
              - link
            nodes:
              - paragraph
          scroll_label:
            label: Scroll Down Label
            type: text
            default: Scroll to explore
            width: 1/2

      - width: 1/3
        sections:
          meta:
            type: fields
            fields:
              featured_projects:
                label: Featured Projects (Home Grid)
                type: pages
                query: site.find("works").children
                min: 1
  seo: seo/page
