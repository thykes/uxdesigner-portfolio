name: Before/After Slider
icon: images
fields:
  before_image:
    label: Before Image
    type: files
    max: 1
  after_image:
    label: After Image
    type: files
    max: 1
  before_label:
    label: Before Label
    type: text
    default: Before
    width: 1/2
  after_label:
    label: After Label
    type: text
    default: After
    width: 1/2
  alignment:
    label: Alignment
    type: select
    default: center
    options:
      left: Left
      center: Center
      right: Right
    width: 1/2
  width:
    label: Width
    type: select
    default: full
    options:
      full: Full Width
      1/2: 1/2
      1/3: 1/3
    width: 1/2
  caption:
    label: Caption
    type: writer
    nodes: false
    marks:
      - bold
      - italic
      - link
