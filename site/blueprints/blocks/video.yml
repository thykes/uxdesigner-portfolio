name: Video
icon: video
fields:
  source:
    label: Video Source
    type: toggles
    default: url
    options:
      url: External Link (YouTube/Vimeo)
      file: Upload File
  url:
    label: Video URL
    type: url
    when:
      source: url
  file:
    label: Upload Video
    type: files
    max: 1
    when:
      source: file
  caption:
    label: Caption
    type: text

  seo_section:
    type: headline
    label: Video SEO Status

  video_title:
    label: Video Title
    type: text
    width: 1/2

  upload_date:
    label: Upload Date
    type: date
    width: 1/2
    default: now

  video_description:
    label: Video Description
    type: textarea
    buttons: false
    size: small
